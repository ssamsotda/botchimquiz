/* VOICE: 쌤솟다 교실 게임, 밝고 다정하게
   IDEA: 퀴즈 영상 카드 그대로 — 받침 칸에 자음 두 개를 끼워 넣는 놀이
   PICTURE: 그림 카드와 빈 받침 칸
   COLOUR and TYPE: 크림 바탕, 남색 글자, 분홍 받침, 노랑 강조 / 경기천년제목
   LAYOUT: 위 시간·점수, 가운데 카드, 아래 자음 버튼 */
:root{color-scheme:light;--bg:#fff8ee;--ink:#1e2a5c;--pink:#ec407a;--pinkbg:#ffecf2;--yel:#ffd64f;--line:#f9bfcd;--ok:#2fae6b}
*{box-sizing:border-box;min-width:0}
html,body{font-synthesis:none;margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:18px/1.4 'GT',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;user-select:none}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 24px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:12px}
.pill{background:var(--yel);border-radius:999px;padding:8px 18px;font-size:22px;white-space:nowrap;box-shadow:0 4px 0 #e9b92a}
.pill b{color:var(--pink);font-weight:400}
.bar{flex:1;height:22px;border-radius:999px;background:#fff;border:3px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--yel);transition:width 1s linear}
.bar.low i{background:var(--pink)}
.sec{font-size:24px;width:58px;text-align:right}
.card{background:#fff;border:6px solid var(--line);border-radius:28px;padding:14px 12px 18px;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 0 #f3d9df;position:relative}
.card img{height:clamp(150px,30vh,240px);max-width:92%;object-fit:contain}
.word{display:flex;gap:clamp(10px,3vw,22px);margin-top:8px;font:clamp(64px,15vw,96px)/1 'GT',sans-serif}
.syl{display:flex;flex-direction:column;align-items:center;gap:8px;width:1.05em}
.syl.on{color:var(--pink)}
.box{width:1.2em;height:.72em;border:5px solid var(--pink);border-radius:16px;background:var(--pinkbg);display:flex;align-items:center;justify-content:center;gap:.04em;color:var(--ink)}
.box span{font:.44em/1 'GT',sans-serif;min-width:1em;text-align:center}
.box.ok{border-color:var(--ok);background:#e5f7ec;color:var(--ok)}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.msg{min-height:44px;margin-top:10px;font-size:24px;text-align:center}
.msg.ok{color:var(--ok)}.msg.no{color:var(--pink)}
.sj{background:linear-gradient(to top,#ffc4d6 46%,transparent 46%);border-radius:6px}
.sc{background:linear-gradient(to right,#ffc4d6 58%,transparent 58%);border-radius:6px}
.hint{display:inline-block;background:#fff6c8;border:3px solid var(--yel);border-radius:999px;padding:4px 18px;font-size:22px;color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.k{font:clamp(34px,8vw,44px)/1 'GT',sans-serif;color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:20px;height:clamp(64px,12vw,80px);cursor:pointer;box-shadow:0 6px 0 var(--ink);touch-action:manipulation}
.k:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.k:focus-visible,.btn:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.sub{display:flex;gap:10px}
.btn{flex:1;font:24px 'GT',sans-serif;border:0;border-radius:18px;padding:14px;cursor:pointer;background:#e8ebf6;color:var(--ink);box-shadow:0 5px 0 #c5cbe2}
.btn.main{background:var(--pink);color:#fff;box-shadow:0 6px 0 #b8285a;font-size:30px;padding:18px 40px;flex:none}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:10px}
.screen h1{font-size:clamp(40px,9vw,60px);line-height:1.05;margin:0}
.screen h1 b{color:var(--pink);font-weight:400}
.rule{background:#fff;border:4px solid var(--line);border-radius:24px;padding:18px 28px;font-size:clamp(22px,4vw,28px);line-height:1.6}
.demo{font:44px/1 'GT',sans-serif;display:inline-flex;gap:6px;vertical-align:middle}
.big{font-size:clamp(70px,18vw,110px);color:var(--pink);line-height:1}
.got{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}
.got span{background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 14px;font:22px 'GT',sans-serif}
.startpic{flex:1;display:flex;align-items:center;justify-content:center}
.sp{position:relative;width:min(100%,560px,calc((100vh - 40px)*0.8575))}
.sp img{display:block;width:100%;height:auto;border-radius:24px}
#go{position:absolute;left:28.5%;top:79.5%;width:42%;height:15%;border:0;border-radius:999px;background:transparent;cursor:pointer}
#go:hover{background:rgba(255,255,255,.12)}#go:active{transform:translateY(3px)}
#go:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.hide{display:none!important}
.home{font:20px 'GT',sans-serif;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;min-height:44px}
@media(max-width:480px){.pill{font-size:18px;padding:8px 12px}.sec{font-size:18px;width:44px}.home{font-size:16px;padding:6px 10px}}
@media(max-height:640px){.card img{height:120px}.word{font-size:58px}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">

const PARTS={'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄼ':'ㄹㅂ','ㄾ':'ㄹㅌ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
const KEYS=['ㄱ','ㄴ','ㄹ','ㅂ','ㅅ','ㅈ','ㅌ','ㅎ'];
const $=id=>document.getElementById(id);
let wrong=0,order=[],pos=0,score=0,left=60,timer=null,typed=[],busy=false,got=[],ac=null;

$('keys').innerHTML=KEYS.map(k=>`<button class="k" data-k="${k}">${k}</button>`).join('');

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function beep(notes){
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    let t=ac.currentTime;
    for(const [f,d,type] of notes){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+0.05);t+=d*0.8;
    }
  }catch(e){}
}
const DING=[[1047,.22],[784,.22],[1319,.5]], BUZZ=[[220,.18,'square'],[180,.3,'square']], TAP=[[660,.06,'triangle']];


// ---- 배경음악
const BPM=112,BEAT=60/BPM;
const PROG=[[48,64,67,72],[53,65,69,72],[55,67,71,74],[48,64,67,72]];
const MEL=[76,79,81,79,77,76,74,76, 77,81,84,81,79,77,76,77, 79,83,86,83,81,79,77,79, 76,79,84,79,76,74,72,72];
let musicOn=true,bgmGain=null,bgmTimer=null,nextT=0,step=0;
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(m,t,d,vol,type){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=hz(m);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(bgmGain);o.start(t);o.stop(t+d+0.05);
}
function schedule(){
  while(nextT<ac.currentTime+0.4){
    const bar=Math.floor(step/8)%4,k=step%8,ch=PROG[bar];
    if(k%2===0){const b=k/2;note(b%2===0?ch[0]-12:ch[0],nextT,BEAT*.8,.5,'triangle');
      if(b%2===1)for(const m of ch.slice(1))note(m,nextT,BEAT*.4,.12,'sine');}
    note(MEL[bar*8+k],nextT,BEAT*.4,.16,'triangle');
    nextT+=BEAT/2;step++;
  }
}
function musicStart(){
  if(!musicOn)return;
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    musicStop();
    bgmGain=ac.createGain();bgmGain.gain.value=0.18;bgmGain.connect(ac.destination);
    nextT=ac.currentTime+0.1;step=0;schedule();bgmTimer=setInterval(schedule,100);
  }catch(e){}
}
function musicStop(){
  clearInterval(bgmTimer);bgmTimer=null;
  if(bgmGain){try{const g=bgmGain;g.gain.setTargetAtTime(0.0001,ac.currentTime,0.08);setTimeout(()=>g.disconnect(),400)}catch(e){}bgmGain=null}
}
$('mute').onclick=()=>{musicOn=!musicOn;$('mute').textContent=musicOn?'음악 끄기':'음악 켜기';
  if(musicOn&&left>0&&!$('play').classList.contains('hide'))musicStart();else musicStop();};

function hintHTML(q){return [...q.h].map((c,i)=>i===q.m?`<span class="sj">${c}</span>`:i===q.m+1&&q.m>=0?`<span class="sc">${c}</span>`:c).join('')}
function cur(){return order[pos%order.length]}
function draw(done){
  const q=cur(),word=[...q.w];
  $('pic').src=q.img;$('pic').alt=q.w;
  $('word').innerHTML=word.map((ch,i)=>{
    if(i!==q.i)return `<div class="syl">${ch}<div style="height:.72em"></div></div>`;
    const shown=done?ch:q.b;
    const slots=done?`<span>${q.j}</span>`:`<span>${typed[0]||''}</span><span>${typed[1]||''}</span>`;
    return `<div class="syl ${done?'on':''}">${shown}<div class="box ${done?'ok':''}" id="box">${slots}</div></div>`;
  }).join('');
}
function newQ(){wrong=0;typed=[];busy=false;$('msg').className='msg';$('msg').innerHTML='';draw(false)}
function press(k){
  if(busy||left<=0)return;
  typed.push(k);beep(TAP);draw(false);
  if(typed.length<2)return;
  const q=cur();busy=true;
  if(typed.join('')===PARTS[q.j]){
    score++;got.push(q.w);$('score').textContent=score;
    draw(true);beep(DING);
    $('msg').className='msg ok';$('msg').textContent='딩동댕! 정답이에요!';
    setTimeout(()=>{if(left>0){pos++;newQ()}},1100);
  }else{
    beep(BUZZ);$('box').classList.add('shake');
    $('msg').className='msg no';
    wrong++;
    $('msg').innerHTML=wrong>=2?`다시 해 봐요! <span class="hint">소리 힌트 [${hintHTML(q)}]</span>`:'다시 해 봐요!';
    setTimeout(()=>{typed=[];busy=false;if(left>0)draw(false)},700);
  }
}
$('keys').addEventListener('click',e=>{const b=e.target.closest('.k');if(b)press(b.dataset.k)});
document.addEventListener('keydown',e=>{if(e.key==='Backspace')$('del').click()});
$('del').onclick=()=>{if(busy)return;typed.pop();draw(false)};

function tick(){
  left--;$('sec').textContent=left+'초';$('fill').style.width=(left/60*100)+'%';
  $('bar').classList.toggle('low',left<=10);
  if(left<=0)finish();
}
function start(){
  order=shuffle(DATA);pos=0;score=0;left=60;got=[];
  $('score').textContent='0';$('sec').textContent='60초';$('fill').style.width='100%';$('bar').classList.remove('low');
  $('start').classList.add('hide');$('end').classList.add('hide');$('play').classList.remove('hide');
  newQ();beep(TAP);musicStart();clearInterval(timer);timer=setInterval(tick,1000);
}
function finish(){
  clearInterval(timer);busy=true;musicStop();
  beep([[784,.18],[988,.18],[1175,.18],[1568,.6]]);
  $('final').textContent=score;
  $('praise').textContent=score>=10?'맞혔어요! 겹받침 박사예요!':score>=5?'맞혔어요! 아주 잘했어요!':'맞혔어요! 한 번 더 도전해 봐요!';
  $('got').innerHTML=got.map(w=>`<span>${w}</span>`).join('');
  $('play').classList.add('hide');$('end').classList.remove('hide');
}
function home(){clearInterval(timer);musicStop();left=0;busy=true;$('play').classList.add('hide');$('end').classList.add('hide');$('start').classList.remove('hide')}
$('home1').onclick=home;$('home2').onclick=home;
$('go').onclick=start;$('again').onclick=start;
}
</script>
